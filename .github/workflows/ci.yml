---
name: ci

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `test` imports ./dist/base.js, so the build has to come first.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test
